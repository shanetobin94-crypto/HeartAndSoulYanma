name: Build Heart & Soul Yanma

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Repository:"
          ls -lah "$GITHUB_WORKSPACE"

      - name: Download Heart & Soul 2.0.0
        run: |
          curl -L --fail -o source.zip \
            https://github.com/PokemonHnS-Development/pokehns-expansion/archive/refs/tags/Release-v2.0.0.zip
          unzip -q source.zip
          mv pokehns-expansion-Release-v2.0.0 source

      - name: Apply Yanma patch
        run: |
          echo "Checking for Yanma patch..."
          test -f "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip"
          ls -lh "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip"

          unzip -oq \
            "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Yanma patch applied."

      - name: Fix custom Yanma learnsets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/src/data/pokemon/species_info.h")
          text = path.read_text()

          # Any custom Yanma form that does not have its own
          # learnset definition will use the normal Yanma learnset.
          #
          # This includes:
          #   sYanmaDemoiselleLevelUpLearnset
          #   sYanmaBlueLevelUpLearnset
          #   sYanmaWhateverLevelUpLearnset
          #
          # The important part is that the base Yanma learnset exists
          # in Heart & Soul 2.0.0.

          pattern = r'sYanma[A-Za-z0-9_]+LevelUpLearnset'

          replacements = sorted(set(re.findall(pattern, text)))

          for symbol in replacements:
              if symbol != "sYanmaLevelUpLearnset":
                  text = text.replace(
                      symbol,
                      "sYanmaLevelUpLearnset"
                  )
                  print(f"Replaced {symbol} -> sYanmaLevelUpLearnset")

          path.write_text(text)

          print("Yanma learnset repair complete.")
          PY

      - name: Inspect Yanma entries
        run: |
          echo "========================================"
          echo "YANMA SPECIES ENTRIES"
          echo "========================================"

          grep -n -B5 -A35 \
            -E 'SPECIES_YANMA|YANMA_DEMOISELLE|YANMA_BLUE|Yanma' \
            source/src/data/pokemon/species_info.h || true

          echo ""
          echo "========================================"
          echo "YANMA LEARNSET REFERENCES"
          echo "========================================"

          grep -n \
            -E 'sYanma.*LevelUpLearnset' \
            source/src/data/pokemon/species_info.h || true

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build Heart & Soul
        working-directory: source
        env:
          GAME_VERSION: POKEMON_HNS
        run: |
          make hns release -j$(nproc) -O

      - name: Find completed ROM
        run: |
          echo "Searching for completed GBA ROM..."

          find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "*.gba" -o -name "*.GBA" \) \
            -print

      - name: Verify ROM exists
        run: |
          ROM=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "*.gba" -o -name "*.GBA" \) \
            | head -n 1)

          if [ -z "$ROM" ]; then
            echo "ERROR: No GBA ROM was produced."
            exit 1
          fi

          echo "ROM FOUND:"
          echo "$ROM"
          ls -lh "$ROM"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: HeartAndSoul-Yanma
          path: |
            source/**/*.gba
            source/**/*.GBA
          if-no-files-found: error
