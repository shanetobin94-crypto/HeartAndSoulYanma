name: Build Heart & Soul Yanma

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Heart & Soul 2.0.0
        run: |
          curl -L --fail -o source.zip \
            https://github.com/PokemonHnS-Development/pokehns-expansion/archive/refs/tags/Release-v2.0.0.zip
          unzip -q source.zip
          mv pokehns-expansion-Release-v2.0.0 source

      - name: Apply Yanma patch
        run: |
          test -f "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip"
          unzip -oq \
            "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip" \
            -d "$GITHUB_WORKSPACE/source"

      - name: Remove remaining Butterfree Frost dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/src/data/pokemon/species_info.h")
          text = path.read_text()

          old = "sButterfreeFrostLevelUpLearnset"
          new = "sButterfreeLevelUpLearnset"

          count = text.count(old)

          print(f"Found {count} Butterfree Frost learnset references.")

          text = text.replace(old, new)

          path.write_text(text)

          print("Butterfree Frost learnset references replaced.")
          PY

      - name: Fix custom Yanma learnsets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("source/src/data/pokemon/species_info.h")
          text = path.read_text()

          pattern = r'sYanma[A-Za-z0-9_]+LevelUpLearnset'

          symbols = sorted(set(re.findall(pattern, text)))

          for symbol in symbols:
              if symbol != "sYanmaLevelUpLearnset":
                  text = text.replace(
                      symbol,
                      "sYanmaLevelUpLearnset"
                  )
                  print(
                      f"Replaced {symbol} "
                      f"-> sYanmaLevelUpLearnset"
                  )

          path.write_text(text)

          print("Yanma learnset references fixed.")
          PY

      - name: Inspect final source
        run: |
          echo "=== Remaining problematic learnsets ==="

          grep -n \
            -E 'sButterfreeFrostLevelUpLearnset|sYanma.*LevelUpLearnset' \
            source/src/data/pokemon/species_info.h || true

      - name: Install GBA compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build Heart & Soul
        working-directory: source
        env:
          GAME_VERSION: POKEMON_HNS
        run: |
          make hns release -j$(nproc) -O

      - name: Find completed ROM
        run: |
          echo "Searching for GBA ROM..."

          find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "*.gba" -o -name "*.GBA" \) \
            -print

      - name: Verify ROM exists
        run: |
          ROM=$(find "$GITHUB_WORKSPACE/source" \
            -type f \
            \( -name "*.gba" -o -name "*.GBA" \) \
            | head -n 1)

          if [ -z "$ROM" ]; then
            echo "ERROR: No GBA ROM was produced."
            exit 1
          fi

          echo "ROM FOUND:"
          echo "$ROM"
          ls -lh "$ROM"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: HeartAndSoul-Yanma
          path: |
            source/**/*.gba
            source/**/*.GBA
          if-no-files-found: error
