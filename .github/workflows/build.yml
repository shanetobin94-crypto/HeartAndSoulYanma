name: Build Heart & Soul Yanma

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Heart & Soul 2.0.0
        run: |
          curl -L --fail -o source.zip \
            https://github.com/PokemonHnS-Development/pokehns-expansion/archive/refs/tags/Release-v2.0.0.zip

          unzip -q source.zip
          mv pokehns-expansion-Release-v2.0.0 source

      - name: Apply our custom patch
        run: |
          echo "Applying Yanma patch..."

          ls -lh "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip"

          unzip -oq \
            "$GITHUB_WORKSPACE/HnS_2.0_Custom_Pokemon_Source_Patch.zip" \
            -d "$GITHUB_WORKSPACE/source"

          echo "Patch applied successfully."

      - name: Repair Butterfree Frost entry
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("source/src/data/pokemon/species_info.h")
          text = path.read_text()

          marker = "[SPECIES_BUTTERFREE_FROST]"
          pos = text.find(marker)

          print("Butterfree Frost position:", pos)

          if pos == -1:
              print("No Butterfree Frost entry found.")
          else:

              # Find the beginning of the species entry.
              start = text.rfind("\n", 0, pos) + 1

              # Find the opening { after the species marker.
              brace = text.find("{", pos)

              if brace == -1:
                  raise RuntimeError(
                      "Could not find opening brace for Butterfree Frost entry."
                  )

              # Find the matching closing brace.
              depth = 0
              in_string = False
              escape = False
              end = None

              for i in range(brace, len(text)):
                  c = text[i]

                  if in_string:
                      if escape:
                          escape = False
                      elif c == "\\":
                          escape = True
                      elif c == '"':
                          in_string = False
                      continue

                  if c == '"':
                      in_string = True

                  elif c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          end = i + 1

                          while end < len(text) and text[end] in " \t":
                              end += 1

                          if end < len(text) and text[end] == ",":
                              end += 1

                          if end < len(text) and text[end] == "\n":
                              end += 1

                          break

              if end is None:
                  raise RuntimeError(
                      "Could not find end of Butterfree Frost entry."
                  )

              # Remove ONLY the malformed Butterfree Frost entry.
              text = text[:start] + text[end:]

              # Remove the incompatible Frost learnset reference if present.
              text = text.replace(
                  "sButterfreeFrostLevelUpLearnset",
                  "sButterfreeLevelUpLearnset"
              )

              path.write_text(text)

              print("Malformed Butterfree Frost entry removed.")
              print("Yanma data has NOT been changed.")

          PY

      - name: Verify patched source
        run: |
          echo "======================================"
          echo "VERIFYING YANMA PATCH"
          echo "======================================"

          echo ""
          echo "Yanma species entries:"
          grep -n -E "SPECIES_YANMA" \
            source/src/data/pokemon/species_info.h || true

          echo ""
          echo "Yanma constants:"
          grep -n -E "YANMA" \
            source/include/constants/species.h || true

          echo ""
          echo "Checking Butterfree Frost:"
          if grep -n "SPECIES_BUTTERFREE_FROST" \
            source/src/data/pokemon/species_info.h; then
            echo "WARNING: Butterfree Frost still appears in species_info.h"
          else
            echo "Butterfree Frost malformed entry is gone."
          fi

          echo ""
          echo "Checking broken Frost learnset:"
          if grep -n "sButterfreeFrostLevelUpLearnset" \
            source/src/data/pokemon/species_info.h; then
            echo "ERROR: Broken Frost learnset symbol still exists."
            exit 1
          else
            echo "OK."
          fi

      - name: Install GBA compiler
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            binutils-arm-none-eabi \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libpng-dev \
            python3

      - name: Build Heart & Soul
        working-directory: source
        env:
          GAME_VERSION: POKEMON_HNS
        run: |
          make hns release -j$(nproc) -O

      - name: Find completed ROM
        run: |
          echo "======================================"
          echo "SEARCHING FOR GBA ROM"
          echo "======================================"

          find source \
            -type f \
            -name "*.gba" \
            -print

      - name: Verify ROM exists
        run: |
          ROM=$(find source -type f -name "*.gba" | head -n 1)

          if [ -z "$ROM" ]; then
            echo "ERROR: No GBA ROM was produced."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ROM FOUND!"
          echo "======================================"

          ls -lh "$ROM"

          echo ""
          echo "ROM PATH:"
          echo "$ROM"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: HeartAndSoulYanma
          path: source/**/*.gba
          if-no-files-found: error
